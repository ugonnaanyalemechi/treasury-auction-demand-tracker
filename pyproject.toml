[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treasury-auction-demand-tracker"
version = "0.1.0"
description = "Tracks demand at U.S. Treasury auctions across the yield curve"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["pipeline", "tests"]
strict = true
