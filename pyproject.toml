[project]
name = "treasury-auction-demand-tracker"
description = "Tracks demand at U.S. Treasury auctions across the yield curve"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m \"not network\""
markers = [
    "network: hits the live Fiscal Data API; excluded by default, run explicitly with -m network",
]

[tool.mypy]
python_version = "3.11"
files = ["pipeline", "tests"]
strict = true
