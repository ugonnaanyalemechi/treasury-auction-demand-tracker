name: Manual data refresh

on:
  workflow_dispatch:
    inputs:
      tenor:
        description: 'original_security_term to fetch, e.g. "10-Year"'
        required: true
        default: "10-Year"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run skeleton pipeline
        env:
          TENOR: ${{ inputs.tenor }}
        run: python -m pipeline.skeleton "$TENOR"

      - name: Commit data.json
        env:
          TENOR: ${{ inputs.tenor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update data.json ($TENOR)"
          git push
