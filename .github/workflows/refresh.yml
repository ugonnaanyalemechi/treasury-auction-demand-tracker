name: Refresh data

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# A rerun waits for the one in flight rather than racing it to push.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Exits non-zero if a validation guard fails, which skips the commit
      # below and leaves the previous data.json live.
      - name: Build data.json
        run: python -m pipeline.refresh

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Refresh data.json"
          git push
